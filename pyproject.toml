[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalformer-2d"
version = "0.1.0"
description = "CrystalFormer-2D: fixed layer-group generation for 2D crystals"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["2d-materials", "layer-group", "crystal-generation"]
dependencies = [
  "dm-haiku==0.0.15",
  "jax==0.6.2",
  "jaxlib==0.6.2",
  "numpy",
  "optax==0.2.6",
  "pandas",
  "pymatgen",
  "pyxtal==1.1.1",
  "spglib",
  "tqdm",
]

[project.scripts]
crystalformer-2d-dataset = "crystalformer.cli.dataset:main"
crystalformer-2d-awl2struct = "crystalformer.cli.awl2struct_2d:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["crystalformer*"]

[tool.setuptools.package-data]
crystalformer = ["data/*.csv"]
